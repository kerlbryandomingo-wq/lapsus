<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lapsus</title>
    <link rel="stylesheet" href="./fullscreen-hint.css" />
  </head>
  <body>
    <!-- Shown above a fullscreen page, never inside it. The URL fragment picks the message. -->
    <p id="exit" role="status">Full screen. Press <kbd>Esc</kbd> to exit.</p>
    <p id="popup-blocked" role="status">
      Lapsus blocked a pop-up. Press <kbd>Esc</kbd> to leave full screen and allow it.
    </p>
  </body>
</html>
